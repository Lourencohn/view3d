name: view3d
description: "TROVATA — Catálogo Digital e Vendas B2B. App para vendedores Trovata visualizarem modelos 3D do catálogo e compartilharem links interativos com compradores, em qualquer dispositivo, sem instalar app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Backend (Postgres + Auth + Storage gerenciado)
  supabase_flutter: ^2.5.0

  # 3D + AR
  model_viewer_plus: ^1.7.0

  # State + Routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Utilities
  share_plus: ^9.0.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
