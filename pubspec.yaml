name: view3d
description: "ShowCase3D / View3D — Vitrine B2B com modelos 3D e AR. Vendedores compartilham links interativos que compradores abrem em qualquer dispositivo, sem instalar app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  # firebase_storage: removido no MVP — Storage requer plano Blaze.
  # GLBs ficam em URLs externas (modelviewer.dev no seed). Reativar quando subir Blaze.

  # 3D + AR
  model_viewer_plus: ^1.7.0

  # State + Routing
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0

  # Utilities
  share_plus: ^13.1.0
  qr_flutter: ^4.1.0
  cached_network_image: ^3.3.1

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
